<!DOCTYPE html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DigitRoller — анимированный счётчик чисел</title>
    <link rel="stylesheet" href="src/style.css" />
    <script defer src="src/script.js"></script>
    <meta name="description" content="Интерактивный анимированный роллер чисел на чистых HTML, CSS и JavaScript." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#080b12" />
  <meta name="color-scheme" content="dark light" />
  <link rel="canonical" href="https://digit-roller.d9911.org/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DigitRoller — анимированный счётчик чисел" />
  <meta property="og:description" content="Интерактивный анимированный роллер чисел на чистых HTML, CSS и JavaScript." />
  <meta property="og:url" content="https://digit-roller.d9911.org/" />
  <meta property="og:image" content="https://digit-roller.d9911.org/src/img/icon-512.png" />
  <meta property="og:image:alt" content="DigitRoller logo" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="DigitRoller — анимированный счётчик чисел" />
  <meta name="twitter:description" content="Интерактивный анимированный роллер чисел на чистых HTML, CSS и JavaScript." />
  <meta name="twitter:image" content="https://digit-roller.d9911.org/src/img/icon-512.png" />
  <link rel="icon" type="image/svg+xml" href="src/img/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="src/img/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="src/img/apple-touch-icon.png" />
  <link rel="manifest" href="src/manifest.webmanifest" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DigitRoller",
      "url": "https://digit-roller.d9911.org/",
      "description": "Интерактивный анимированный роллер чисел на чистых HTML, CSS и JavaScript.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "inLanguage": [
        "ru"
      ],
      "isAccessibleForFree": true
    }
  </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="skip">Перейти к приложению</a>
    <header class="app-header">
      <div class="header-container">
        <div class="brand">
          <img class="brand-logo" src="src/img/icon-192.png" alt="" width="36" height="36" />
          <h1>DigitRoller</h1>
        </div>
        <nav class="app-controls" role="group" aria-label="Настройки отображения" data-i18n-aria="displaySettings">
          <div class="language-menu">
          <select id="language-select" tabindex="-1" hidden>
            <option value="ru">Русский</option>
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
          <button class="control-button language-menu__trigger" id="language-menu-button" type="button" aria-label="Язык: Русский" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu-list">
            <span class="language-menu__flag" aria-hidden="true">RU</span>
            <span class="language-menu__label">Русский</span>
            <svg class="language-menu__chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10.5832 6.00002L7.99657 8.58669L5.4099 6.00002C5.1499 5.74002 4.7299 5.74002 4.4699 6.00002C4.2099 6.26002 4.2099 6.68002 4.4699 6.94002L7.5299 10C7.7899 10.26 8.2099 10.26 8.4699 10L11.5299 6.94002C11.7899 6.68002 11.7899 6.26002 11.5299 6.00002C11.2699 5.74669 10.8432 5.74002 10.5832 6.00002Z" fill="currentColor" /></svg>
          </button>
          <div class="language-menu__panel" id="language-menu-list" role="menu" aria-labelledby="language-menu-button" hidden>
            <button class="language-menu__option" type="button" role="menuitemradio" aria-checked="false" data-language="en" data-flag="EN"><span class="language-menu__flag" aria-hidden="true">EN</span><span>English</span><span class="language-menu__check" aria-hidden="true">✓</span></button>
            <button class="language-menu__option" type="button" role="menuitemradio" aria-checked="false" data-language="es" data-flag="ES"><span class="language-menu__flag" aria-hidden="true">ES</span><span>Español</span><span class="language-menu__check" aria-hidden="true">✓</span></button>
            <button class="language-menu__option" type="button" role="menuitemradio" aria-checked="true" data-language="ru" data-flag="RU"><span class="language-menu__flag" aria-hidden="true">RU</span><span>Русский</span><span class="language-menu__check" aria-hidden="true">✓</span></button>
          </div>
          </div>
          <button id="theme-toggle" class="control-button theme-toggle" type="button" aria-label="Включить светлую тему">
            <span id="theme-toggle-icon" aria-hidden="true">☀️</span>
            <span id="theme-toggle-text" class="sr-only">Светлая</span>
          </button>
        </nav>
      </div>
    </header>
    <div class="page-shell">
    <main class="app" id="main-content">
      <div class="controls">
        <div class="field">
          <label for="from" data-i18n="currentValue">Текущее значение</label>
          <input id="from" type="text" value="30,00 $/month" />
        </div>
        <div class="field">
          <label for="to" data-i18n="newValue">Новое значение</label>
          <input id="to" type="text" value="300,00 $/year" />
        </div>
        <button id="run" data-i18n="animate">Анимировать</button>
      </div>

      <div class="card">
        <h2 class="label" data-i18n="preview">Просмотр</h2>
        <div class="row">
          <div id="roller" class="roller" aria-live="polite"></div>
        </div>
        <div class="note" data-i18n="note">Цифры прокручиваются циклически (0→9→0). Нецифровые символы меняются сразу.</div>
      </div>
    </main>
      <footer class="app-footer">
        <span data-i18n="footer">Локальная демонстрация анимации чисел на HTML, CSS и JavaScript.</span>
        <a href="https://d9911.org/">d9911.org</a>
      </footer>
    </div>
  </body>
</html>
